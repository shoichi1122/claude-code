name: Deploy apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'daily-schedule-app/**'
      - 'referral-sns-app/**'
      - 'thank-you-app/**'
      - '.github/workflows/deploy-schedule-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (schedule app at root, referral app and thank-you app in subfolders)
        run: |
          mkdir -p _site/referral-sns-app _site/thank-you-app
          cp -r daily-schedule-app/. _site/
          cp -r referral-sns-app/. _site/referral-sns-app/
          cp -r thank-you-app/. _site/thank-you-app/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
